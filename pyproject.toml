[project]
name = "lastseen"
version = "0.1.0"
description = "A private location history for your Apple devices (works with iCloud Find My)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sharif Rafid" }]
requires-python = ">=3.10"
dependencies = ["pyicloud==2026.10.1"]
keywords = ["icloud", "find-my", "location-history", "self-hosted", "gps", "timeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sharifrafid/lastseen"
Issues = "https://github.com/sharifrafid/lastseen/issues"

[project.scripts]
lastseen = "lastseen.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lastseen"
source-include = ["tests/**"]
source-exclude = ["**/__pycache__/**"]

[dependency-groups]
dev = ["pytest>=8"]
